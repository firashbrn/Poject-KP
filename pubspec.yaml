version: 1.0.0+1

environment:
  sdk: ^3.10.7


dependencies:
  # Architecture
  flutter_clean_architecture: ^6.0.2
  flutter_riverpod: ^2.4.9

  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Reactive
  rxdart: ^0.28.0

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  intl: ^0.18.1
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

  lottie: ^3.3.2
  device_info_plus: ^12.3.0
  get_it: ^7.7.0

  # Device Features
  geolocator: ^10.1.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  geocoding: ^2.1.1


flutter:
  uses-material-design: true
  assets:
    - assets/Login.json
    - assets/images/